[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E701/E702: one-line ifs are an accepted style in this codebase
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# main.py imports models inside lifespan solely to register them with create_all
"main.py" = ["F401"]
# conftest sets env vars before app imports, by design
"tests/conftest.py" = ["E402", "F401"]
